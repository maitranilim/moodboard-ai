<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Create a responsive moodboard from a single feeling." />
  <title>Moodboard AI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%236f9c8f'/%3E%3Ccircle cx='23' cy='25' r='9' fill='%23fff9ec'/%3E%3Cpath d='M15 48h34L36 30 27 41l-5-6z' fill='%23f5f8f6'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell" aria-live="polite">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Moodboard AI home">Moodboard AI</a>
      <p class="credit">made by Nilim</p>
    </header>

    <section class="hero" aria-labelledby="pageTitle">
      <div class="hero-copy">
        <h1 id="pageTitle">Type a feeling to see your moodboard</h1>
        <p>Enter an emotion like calm, joyful, or melancholy and watch the palette and images shift with it.</p>
      </div>

      <form class="mood-form" id="moodForm">
        <label class="sr-only" for="moodInput">Mood or emotion</label>
        <input
          id="moodInput"
          type="text"
          name="mood"
          placeholder="calm, joyful, melancholy..."
          autocomplete="off"
          spellcheck="true"
        />
        <button type="submit" id="generateBtn">Show Mood</button>
      </form>

      <p class="status" id="moodStatus">Showing: calm</p>
    </section>

    <section class="moodboard" aria-label="Generated moodboard">
      <div class="moodboard-grid" id="moodGrid"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
