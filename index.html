<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moodboard AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1 class="title">Moodboard <span>AI</span></h1>
    <div class="controls glass">
      <input id="moodInput" type="text" placeholder="Enter your mood..." />
      <button id="generateBtn">Generate</button>
      <button id="themeToggle">🌗</button>
    </div>
    <div class="moodboard-grid" id="moodGrid"></div>
  </div>
  <p class="credit">made by nilim</p>
  <script src="script.js"></script>
</body>
</html>
